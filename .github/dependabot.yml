# ==============================================================================
# Dependabot Configuration for SmartCommute
# Automated dependency updates for GitHub Actions, NPM, and Python (uv/pip)
# ==============================================================================

version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain root NPM development dependencies (husky, prettier, commitlint)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      root-dependencies:
        patterns:
          - "*"

  # Maintain frontend React/TypeScript application dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "FE"
      - "dependencies"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "jsdom"
      lint-and-types:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "prettier"
          - "typescript"
          - "@typescript-eslint/*"
    ignore:
      # Keep tailwindcss on v3 until deliberate migration to v4 (@tailwindcss/postcss) is performed
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Maintain backend FastAPI/Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "BE"
      - "dependencies"
    groups:
      backend-dependencies:
        patterns:
          - "*"
