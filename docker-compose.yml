services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-commute-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: "sqlite:////app/data/smart_commute.db"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - sqlite_data:/app/data
    networks:
      - smart-commute-net
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-commute-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smart-commute-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sqlite_data:
    name: smart-commute-sqlite-data

networks:
  smart-commute-net:
    name: smart-commute-net
    driver: bridge
